[project]
name = "ig-downloader"
version = "0.1.0"
description = "Download images from Instagram profiles, posts, and saved collections."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "instaloader>=4.15.3",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
